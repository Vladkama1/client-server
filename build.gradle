plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.sonarqube' version '4.0.0.2929'
  id 'jacoco'
}

group = 'ru.astondevs.evergreen'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

ext {
  set('springCloudVersion', "2024.0.0")
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
  implementation("org.springframework.cloud:spring-cloud-starter-kubernetes-client:3.2.0")
  implementation("org.springframework.cloud:spring-cloud-kubernetes-client-loadbalancer:3.2.0")
  implementation("org.postgresql:postgresql:42.7.3")
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  implementation 'io.micrometer:micrometer-core'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
  runtimeOnly 'org.postgresql:postgresql'
  implementation 'org.liquibase:liquibase-core'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-logging'
  implementation("org.springframework.boot:spring-boot-starter-data-jpa")
  implementation "org.liquibase:liquibase-core:4.28.0"
  implementation group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.28'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '3.3.8'
  implementation 'org.mapstruct:mapstruct:1.5.5.Final'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

  //implementation("net.lbruun.springboot:preliquibase-spring-boot-starter")

}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()  // Указываем использование JUnit для выполнения тестов
}

tasks.test {
    finalizedBy jacocoTestReport  // ✅ Jacoco запускается ПОСЛЕ тестов, но не триггерит их
}

tasks.jacocoTestReport {
    reports {
        csv.required = false  // Не генерируем CSV отчёт
        xml.required = true    // Генерируем XML отчёт
        html.required = true   // Генерируем HTML отчёт
    }
}


sonarqube {}