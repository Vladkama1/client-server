plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.sonarqube' version '4.0.0.2929'
  id 'jacoco'
  id 'com.google.protobuf' version '0.9.4'
}

group = 'ru.astondevs.evergreen'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

ext {
  set('springCloudVersion', "2024.0.0")
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
  implementation("org.springframework.cloud:spring-cloud-starter-kubernetes-client:3.2.0")
  implementation("org.springframework.cloud:spring-cloud-kubernetes-client-loadbalancer:3.2.0")
  implementation("org.postgresql:postgresql")
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  implementation 'io.micrometer:micrometer-core'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
  runtimeOnly 'org.postgresql:postgresql'
//  implementation 'org.liquibase:liquibase-core'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-logging'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'net.devh:grpc-spring-boot-starter:2.15.0.RELEASE'
  implementation 'io.grpc:grpc-netty:1.58.0'
  implementation 'io.grpc:grpc-protobuf:1.58.0'
  implementation 'io.grpc:grpc-stub:1.58.0'
  compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:3.24.0"
  }
  plugins {
    grpc {
      artifact = "io.grpc:protoc-gen-grpc-java:1.58.0"
    }
  }
  generateProtoTasks {
    all().each { task ->
      task.plugins {
        grpc {}
      }
    }
  }
}

sourceSets {
  main {
    java {
      srcDirs 'build/generated/source/proto/main/grpc'
      srcDirs 'build/generated/source/proto/main/java'
    }
  }
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

tasks.test {
    useJUnitPlatform() 
}

sonarqube {}