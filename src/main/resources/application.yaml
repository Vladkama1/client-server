server:
  port: ${CLIENT_SERVER_PORT:8080}

spring:
  application.name: client-server
  cloud:
    kubernetes:
      loadbalancer:
        mode: service
      discovery:
        enabled: true
      reload:
        enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:clientDB}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  liquibase:
    enabled: false
    drop-first: false
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    hostname: ${CLIENT_SERVER_HOST:localhost}
    preferIpAddress: true
    instanceId: ${spring.application.name}:${spring.application.instance_id:${server.port}-${random.value}}
    leaseRenewalIntervalInSeconds: 30

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    prometheus:
      enabled=true:
  metrics:
    export:
      prometheus:
        enabled=true:

logging:
  level:
    com:
      local:
        resource-service: TRACE
    org:
      springframework:
        orm:
          jpa: TRACE
          jpa.JpaTransactionManager: DEBUG
          transaction: INFO
          transaction.interceptor: TRACE
